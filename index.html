<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بلدية القرية — تسجيل الدخول</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="login.css">
</head>

<body>

  <div id="toast-container"></div>

  <div class="login-bg">
    <div class="login-card">

      <div class="login-logo">🏛️</div>

      <h1 class="login-title">بلدية القرية</h1>
      <p class="login-sub">تسجيل الدخول إلى نظام الإدارة</p>

      <form id="login-form" class="login-form" autocomplete="off">

        <div class="form-group">
          <label class="form-label">اسم المستخدم</label>
          <input id="username" class="form-input" type="text" required>
        </div>

        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <input id="password" class="form-input" type="password" required>
        </div>

        <div id="login-error" class="login-error"></div>

        <button type="submit" class="btn btn-primary" style="width:100%">
          تسجيل الدخول
        </button>

      </form>

      <div class="login-footer">للموظفين المخوّلين فقط</div>

    </div>
  </div>

  <!-- 👇 هذا مهم لا تحذفه -->
  <script src="app.js"></script>

  <script>
    // لا نخرب سكربتك الأصلي، فقط نتأكد أنه يشتغل
    if (typeof initLogin === "function") {
      initLogin();
    }
  </script>

</body>
</html>
