<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بلدية القرية — تسجيل الدخول</title>
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div id="toast-container"></div>
  <div class="login-bg">
    <div class="login-glow login-glow-1"></div>
    <div class="login-glow login-glow-2"></div>
    <div class="login-card">
      <div class="login-logo">🏛️</div>
      <h1 class="login-title">بلدية القرية</h1>
      <p class="login-sub">تسجيل الدخول إلى نظام الإدارة</p>
      <form id="login-form" class="login-form" autocomplete="off">
        <div class="form-group">
          <label class="form-label">اسم المستخدم</label>
          <input id="username" class="form-input" type="text" placeholder="أدخل اسم المستخدم" required>
        </div>
        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <input id="password" class="form-input" type="password" placeholder="أدخل كلمة المرور" required>
        </div>
        <div id="login-error" class="login-error"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;font-size:16px">
          تسجيل الدخول
        </button>
      </form>
      <div class="login-footer">للموظفين المخوّلين فقط</div>
    </div>
  </div>
  <script src="app.js"></script>
  <script>initLogin();</script>
</body>
</html>
