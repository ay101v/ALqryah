<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بلدية القرية — السكان</title>

  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="residents.css">
</head>

<body>

  <div id="toast-container"></div>

  <nav class="navbar">
    <div class="navbar-inner">

      <div class="navbar-brand">
        <div class="navbar-logo">🏛️</div>
        <span class="navbar-title">بلدية القرية</span>
      </div>

      <div class="navbar-links">
        <a href="dashboard.html">📊 لوحة التحكم</a>
        <a href="residents.html">👥 السكان</a>
        <a href="vehicles.html">🚗 المركبات</a>
        <a href="employees.html">👔 الموظفون</a>
      </div>

      <div class="navbar-right">
        <div class="navbar-user">مرحباً <span id="nav-username"></span></div>
        <button class="btn-logout">🚪 خروج</button>
      </div>

    </div>
  </nav>

  <div class="page-content">

    <div class="page-header-row">
      <div class="page-header">
        <h1>سجل السكان</h1>
        <p>إدارة المواطنين والأسر والبيانات</p>
      </div>

      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input id="resident-search" type="text" placeholder="ابحث بالاسم أو الهوية أو العنوان...">
        </div>

        <button id="btn-add-resident" class="btn btn-primary">➕ إضافة شخص</button>
      </div>
    </div>

    <div id="residents-grid" class="grid-4 residents-grid"></div>

  </div>

  <button id="fab-add-resident" class="fab">➕</button>

  <!-- ===== عرض الساكن ===== -->
  <div id="view-resident-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2>تفاصيل الساكن</h2>
        <button class="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div id="view-resident-content"></div>
      </div>
    </div>
  </div>

  <!-- ===== إضافة / تعديل ساكن ===== -->
  <div id="add-resident-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="resident-modal-title">تسجيل ساكن جديد</h2>
        <button class="modal-close">✕</button>
      </div>

      <div class="modal-body">

        <form id="resident-form">

          <!-- بيانات شخصية -->
          <div class="form-section">
            <div class="form-section-title">البيانات الشخصية</div>

            <div class="grid-2" style="gap:14px">

              <div class="form-group">
                <label class="form-label">الاسم الكامل *</label>
                <input id="r-fullName" class="form-input" required>
              </div>

              <div class="form-group">
                <label class="form-label">اسم الأب *</label>
                <input id="r-fatherName" class="form-input" required>
              </div>

              <div class="form-group">
                <label class="form-label">رقم الهوية *</label>
                <input id="r-nationalId" class="form-input" required>
              </div>

              <div class="grid-2" style="gap:10px">

                <div class="form-group">
                  <label class="form-label">العمر *</label>
                  <input id="r-age" class="form-input" type="number" required>
                </div>

                <div class="form-group">
                  <label class="form-label">الجنس *</label>
                  <select id="r-gender" class="form-select">
                    <option value="male">ذكر</option>
                    <option value="female">أنثى</option>
                    <option value="child">طفل</option>
                  </select>
                </div>

              </div>

            </div>
          </div>

          <!-- عنوان -->
          <div class="form-section">
            <div class="form-section-title">العنوان</div>

            <div class="grid-3" style="gap:14px">

              <input id="r-address" class="form-input" placeholder="المنطقة">
              <input id="r-streetName" class="form-input" placeholder="الشارع">
              <input id="r-houseNumber" class="form-input" placeholder="رقم المنزل">

            </div>
          </div>

          <!-- وظيفة -->
          <div class="form-section">
            <div class="form-section-title">المهنة</div>

            <div class="grid-2" style="gap:14px">

              <input id="r-job" class="form-input" placeholder="الوظيفة">
              <input id="r-workplace" class="form-input" placeholder="جهة العمل">

            </div>
          </div>

          <!-- صور -->
          <div class="form-section">
            <div class="form-section-title">الصور</div>

            <div class="grid-2" style="gap:14px">

              <div class="form-group">
                <label class="form-label">صورة الشخص</label>
                <input type="file" id="photo-input" accept="image/*">
                <img id="photo-preview" style="display:none">
              </div>

              <div class="form-group">
                <label class="form-label">صورة الهوية</label>
                <input type="file" id="id-photo-input" accept="image/*">
                <img id="id-photo-preview" style="display:none">
              </div>

            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-outline modal-close">إلغاء</button>
            <button type="submit" class="btn btn-primary">حفظ</button>
          </div>

        </form>

      </div>
    </div>
  </div>

  <script src="app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    initResidents();
  });
</script>

</body>
</html>
